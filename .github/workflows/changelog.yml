name: Auto Changelog

on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC daily
  workflow_dispatch:        # allow manual runs for testing

jobs:
  update-changelog:
    name: Scan branches and update CHANGELOG.md
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history needed so git log --since works correctly
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Scan commits and update CHANGELOG.md
        run: python scripts/update_changelog.py

      - name: Commit and push if CHANGELOG.md changed
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG.md is already up to date  -  nothing to commit."
          else
            git add CHANGELOG.md
            git commit -m "chore: auto-update changelog $(date -u +%Y-%m-%d) [skip ci]"
            git push origin HEAD
          fi
