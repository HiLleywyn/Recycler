[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# The framework (hilleywyn/framework) is public and the Dockerfile auto-refreshes
# it on every build, so a plain redeploy always picks up the current framework --
# no build variables, tokens, or "redeploy without cache" needed.
[build.args]
FRAMEWORK_REF = "main"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
