[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# Recycler is the clanker-only Discord bot. It serves no HTTP surface of its
# own (the economy REST API/dashboard lives in Discoin), so there is no
# healthcheck path -- Railway treats the running process as healthy.
[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Persistent volume  -  keeps PostgreSQL data and backups across redeploys.
# Without this, /data is ephemeral and the DB resets on every deploy.
[[mounts]]
source = "recycler_data"
destination = "/data"
